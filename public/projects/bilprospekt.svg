<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" shape-rendering="crispEdges">
  <!-- Placeholder illustration for Bilprospekt: purple background, search field and a pixel car -->
  <rect width="320" height="200" fill="#6457a6"/>

  <!-- Pixel sparkles -->
  <g fill="#ffe066">
    <rect x="28" y="104" width="4" height="12"/><rect x="24" y="108" width="12" height="4"/>
    <rect x="282" y="132" width="4" height="12"/><rect x="278" y="136" width="12" height="4"/>
  </g>
  <g fill="#ff8ac6">
    <rect x="262" y="96" width="6" height="6"/>
    <rect x="52" y="148" width="6" height="6"/>
    <rect x="292" y="20" width="6" height="6"/>
  </g>

  <!-- Search field -->
  <rect x="44" y="40" width="240" height="40" rx="20" fill="#17173d"/>
  <rect x="40" y="36" width="240" height="40" rx="20" fill="#ffffff" stroke="#17173d" stroke-width="3"/>
  <g shape-rendering="geometricPrecision">
    <circle cx="62" cy="54" r="7" fill="none" stroke="#17173d" stroke-width="3"/>
    <line x1="67" y1="59" x2="73" y2="65" stroke="#17173d" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect x="84" y="52" width="40" height="8" fill="#d9d9de"/>
  <rect x="130" y="52" width="48" height="8" fill="#d9d9de"/>
  <rect x="184" y="47" width="3" height="18" fill="#6457a6"/>
  <rect x="232" y="42" width="40" height="28" rx="14" fill="#c8f25a" stroke="#17173d" stroke-width="2"/>
  <g fill="#17173d">
    <rect x="244" y="54" width="14" height="4"/>
    <rect x="254" y="50" width="4" height="4"/>
    <rect x="254" y="58" width="4" height="4"/>
  </g>

  <!-- Speed lines -->
  <g fill="#c8f25a">
    <rect x="68" y="124" width="24" height="4"/>
    <rect x="80" y="136" width="16" height="4"/>
  </g>

  <!-- Pixel car (8px grid) -->
  <rect x="136" y="112" width="48" height="8" fill="#ff8ac6"/>
  <rect x="128" y="120" width="64" height="8" fill="#ff8ac6"/>
  <rect x="136" y="120" width="16" height="8" fill="#bfe8ff"/>
  <rect x="160" y="120" width="24" height="8" fill="#bfe8ff"/>
  <rect x="104" y="128" width="112" height="16" fill="#ff8ac6"/>
  <rect x="104" y="128" width="8" height="8" fill="#ff4d6d"/>
  <rect x="208" y="128" width="8" height="8" fill="#ffe066"/>
  <rect x="152" y="136" width="16" height="2" fill="#17173d" opacity="0.35"/>
  <rect x="120" y="136" width="24" height="16" fill="#17173d"/>
  <rect x="176" y="136" width="24" height="16" fill="#17173d"/>
  <rect x="128" y="140" width="8" height="8" fill="#d9d9de"/>
  <rect x="184" y="140" width="8" height="8" fill="#d9d9de"/>

  <!-- Road -->
  <rect x="40" y="152" width="240" height="4" fill="#17173d" opacity="0.45"/>
  <g fill="#ffffff" opacity="0.5">
    <rect x="60" y="164" width="24" height="4"/>
    <rect x="120" y="164" width="24" height="4"/>
    <rect x="180" y="164" width="24" height="4"/>
    <rect x="240" y="164" width="24" height="4"/>
  </g>
</svg>
